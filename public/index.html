<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinBot Central Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="brand">
                <h1>BINBOT // CMS</h1>
                <p class="subtitle">PUP CpE Final Project</p>
            </div>
            <div class="status-badge" id="mqtt-status">
                <span class="indicator"></span>
                <span class="status-text">MQTT DISCONNECTED</span>
            </div>
        </header>

        <main class="dashboard-grid">
            
            <section class="card telemetry-card">
                <h3>WASTE FILL LEVEL</h3>
                <div class="progress-container">
                    <div class="progress-bar-vertical">
                        <div class="progress-fill" id="fill-bar" style="height: 0%;"></div>
                    </div>
                    <div class="metric-display">
                        <span class="metric-value" id="fill-text">0</span><span class="metric-unit">%</span>
                    </div>
                </div>
            </section>

            <section class="card stats-card">
                <h3>SYSTEM METRICS</h3>
                <div class="stat-group">
                    <div class="stat-item">
                        <label>LID STATE</label>
                        <div class="value strings" id="lid-state">UNKNOWN</div>
                    </div>
                    <div class="stat-item">
                        <label>TOTAL USAGE COUNT</label>
                        <div class="value numbers" id="usage-count">0</div>
                    </div>
                    <div class="stat-item">
                        <label>API LATENCY</label>
                        <div class="value numbers" id="latency-value">-- <span class="unit">ms</span></div>
                    </div>
                </div>
            </section>

            <section class="card control-card">
                <h3>HARDWARE OVERRIDE</h3>
                <p class="card-desc">Manually trigger BinBot lid mechanisms via Adafruit IO MQTT gateway.</p>
                <div class="control-actions">
                    <button class="btn btn-open" onclick="sendControl('OPEN')">TRIGGER OPEN</button>
                    <button class="btn btn-close" onclick="sendControl('CLOSE')">TRIGGER CLOSE</button>
                </div>
            </section>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
